services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: course-agent-backend:phase4
    env_file:
      - .env
    environment:
      AGENT_SESSION_DB_PATH: /app/session_data/sessions.db
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - agent_session_data:/app/session_data
    restart: unless-stopped

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile.frontend
    image: course-agent-frontend:phase4
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  agent_session_data:
